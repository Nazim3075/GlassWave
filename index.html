<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GlassWave Music</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <meta name="theme-color" content="#0d0b14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0b0912;
      --surface: #151122;
      --surface-2: #1e1830;
      --accent: #a855f7;
      --accent-2: #ec4899;
      --text: #f5f3ff;
      --muted: #9b92b5;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #app {
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 170px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 9, 18, 0.9);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 6px 18px rgba(168, 85, 247, 0.35);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .pill-btn, .icon-btn, .speed-pill {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .pill-btn.active-toggle {
      border-color: var(--accent);
      background: rgba(168, 85, 247, 0.22);
      color: #fff;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn.small {
      width: 30px;
      height: 30px;
      font-size: 14px;
    }

    .icon-btn.fav-active {
      color: #fb7185;
      border-color: rgba(251, 113, 133, 0.4);
    }

    .speed-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 16px 10px;
      flex-wrap: wrap;
    }

    .content {
      flex: 1;
      padding: 0 16px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-box input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 15px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-submit {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .quick-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }

    .quick-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip:hover, .chip.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(168, 85, 247, 0.16);
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
      margin: 8px 0 10px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 46px 16px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 40px;
      opacity: 0.45;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px 11px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .track-card:active {
      transform: scale(0.99);
    }

    .track-card.active {
      border-color: var(--accent);
      background: var(--surface-2);
    }

    .track-cover {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface-2);
    }

    .track-meta {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .track-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .track-dur {
      font-size: 12px;
      color: var(--muted);
    }

    .player-bar {
      display: none;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 72px;
      width: calc(100% - 24px);
      max-width: 516px;
      background: rgba(24, 19, 41, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 18px;
      padding: 10px 12px;
      z-index: 30;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .player-bar.visible {
      display: block;
    }

    .player-bar.expanded {
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      max-width: 100%;
      height: 100vh;
      border-radius: 0;
      transform: none;
      z-index: 60;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px 20px 34px;
      background: linear-gradient(180deg, var(--surface-2) 0%, var(--bg) 72%);
      cursor: default;
      overflow-y: auto;
    }

    .expanded-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .expanded-art-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 10px 0;
    }

    .expanded-art {
      width: 220px;
      height: 220px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      margin-bottom: 18px;
    }

    .expanded-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .expanded-artist {
      font-size: 14px;
      color: var(--muted);
    }

    .expanded-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .ctrl-btn.big {
      width: 54px;
      height: 54px;
      font-size: 19px;
    }

    .ctrl-btn.mode-btn.active {
      border-color: var(--accent);
      background: rgba(168, 85, 247, 0.25);
      color: #fff;
    }

    .up-next-box {
      margin-top: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .up-next-box strong {
      color: var(--text);
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-thumb {
      width: 42px;
      height: 42px;
      border-radius: 9px;
      object-fit: cover;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      gap: 6px;
    }

    .ctrl-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      color: #fff;
    }

    .player-seek {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .player-seek input {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 8px;
      width: calc(100% - 24px);
      max-width: 516px;
      background: rgba(20, 16, 34, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 6px;
      z-index: 25;
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item.active {
      background: rgba(168, 85, 247, 0.2);
      color: var(--text);
    }

    .loading-box {
      display: flex;
      justify-content: center;
      padding: 36px 0;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 70;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .setting-row label {
      font-size: 12px;
      color: var(--muted);
    }

    .setting-row select {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
