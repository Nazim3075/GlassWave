<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GlassWave Music</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <meta name="theme-color" content="#050507">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #050507;
      --surface: rgba(24, 24, 28, 0.72);
      --surface-2: rgba(38, 38, 44, 0.85);
      --glass: rgba(28, 28, 32, 0.68);
      --glass-border: rgba(255, 255, 255, 0.14);
      --accent: #a855f7;
      --accent-2: #ec4899;
      --text: #ffffff;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.09);
      --ambient-color: rgba(168, 85, 247, 0.28);
      --ambient-color-2: rgba(236, 72, 153, 0.2);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 10%, var(--ambient-color), transparent 48%),
        radial-gradient(circle at 85% 25%, var(--ambient-color-2), transparent 45%),
        var(--bg);
      transition: background 0.5s ease;
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 185px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(5, 5, 7, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 6px 14px 6px 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-btn, .icon-btn, .speed-pill {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.16s ease;
    }

    .pill-btn:hover, .icon-btn:hover, .speed-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .pill-btn.active-toggle {
      border-color: rgba(255, 255, 255, 0.45);
      background: #ffffff;
      color: #09090b;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .icon-btn.small {
      width: 34px;
      height: 34px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .icon-btn.fav-active {
      color: #ff4d6d;
      border-color: rgba(255, 77, 109, 0.5);
      background: rgba(255, 77, 109, 0.14);
    }

    .speed-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 16px 10px;
      flex-wrap: wrap;
    }

    .content {
      flex: 1;
      padding: 0 16px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-box input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      backdrop-filter: blur(12px);
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .search-box input:focus {
      border-color: rgba(255, 255, 255, 0.42);
      background: rgba(255, 255, 255, 0.09);
    }

    .search-submit {
      background: #ffffff;
      color: #09090b;
      border: none;
      border-radius: 999px;
      padding: 0 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .search-submit:active {
      transform: scale(0.97);
    }

    .quick-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 14px;
      scrollbar-width: none;
    }

    .quick-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: rgba(255, 255, 255, 0.07);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      padding: 7px 15px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .chip.active {
      background: #ffffff;
      color: #09090b;
      border-color: #ffffff;
    }

    .section-label {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff;
      margin: 10px 0 12px;
      text-transform: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .status-banner {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
    }

    .empty-state {
      text-align: center;
      padding: 46px 16px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 42px;
      opacity: 0.5;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--muted);
    }

    /* Horizontal YT Music Home Playlists Row */
    .yt-playlists-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }

    .yt-playlists-row::-webkit-scrollbar {
      display: none;
    }

    .yt-pl-card {
      min-width: 148px;
      max-width: 148px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 16px;
      padding: 10px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.14s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .yt-pl-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .yt-pl-card:active {
      transform: scale(0.97);
    }

    .yt-pl-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      object-fit: cover;
      background: #18181b;
      margin-bottom: 8px;
    }

    .yt-pl-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .yt-pl-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 9px 12px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .track-card:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .track-card:active {
      transform: scale(0.99);
    }

    .track-card.active {
      border-color: rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.11);
    }

    .track-cover {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      background: #18181b;
    }

    .track-meta {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .q-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: #e4e4e7;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .q-badge.preview {
      background: rgba(245, 158, 11, 0.16);
      color: #fcd34d;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .track-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-dur {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .player-bar {
      display: none;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 82px;
      width: calc(100% - 24px);
      max-width: 516px;
      background: rgba(28, 28, 34, 0.82);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 10px 14px;
      z-index: 30;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .player-bar.visible {
      display: block;
    }

    .player-bar.expanded {
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      max-width: 100%;
      height: 100vh;
      border-radius: 0;
      transform: none;
      z-index: 60;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 20px 28px;
      background:
        radial-gradient(circle at 50% 18%, var(--ambient-color), transparent 58%),
        linear-gradient(180deg, rgba(45, 26, 18, 0.92) 0%, rgba(16, 12, 11, 0.98) 65%, #070709 100%);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      cursor: default;
      overflow-y: auto;
    }

    .drag-handle {
      width: 44px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
      margin: 0 auto 10px;
    }

    .expanded-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .expanded-art-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 8px 0;
      flex: 1;
      justify-content: center;
    }

    .expanded-art {
      width: 176px;
      height: 176px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
      margin-bottom: 14px;
    }

    .expanded-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .expanded-artist {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 10px;
    }

    .info-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .info-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.88);
    }

    .lyrics-box {
      width: 100%;
      max-height: 165px;
      overflow-y: auto;
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 15px;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.92);
      white-space: pre-line;
      text-align: center;
      scrollbar-width: thin;
    }

    .lyrics-muted {
      color: rgba(255, 255, 255, 0.58);
      font-size: 13px;
    }

    .codec-badge-row {
      display: flex;
      justify-content: center;
      margin: 10px 0 6px;
    }

    .codec-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      backdrop-filter: blur(12px);
    }

    .codec-tag {
      background: rgba(255, 255, 255, 0.18);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .expanded-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .secondary-glass-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
    }

    .glass-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(14px);
      transition: all 0.15s ease;
    }

    .glass-circle-btn.active {
      background: #ffffff;
      color: #09090b;
      border-color: #ffffff;
    }

    .ctrl-btn.big {
      width: 56px;
      height: 56px;
      font-size: 19px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .ctrl-btn.big.primary {
      width: 64px;
      height: 64px;
      font-size: 21px;
      background: #ffffff;
      color: #09090b;
      border: none;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .ctrl-btn.mode-btn.active {
      border-color: #ffffff;
      background: #ffffff;
      color: #09090b;
    }

    .up-next-box {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.72);
    }

    .up-next-box strong {
      color: #ffffff;
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-thumb {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      gap: 6px;
    }

    .ctrl-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .ctrl-btn.primary {
      background: #ffffff;
      border: none;
      color: #09090b;
      font-weight: 700;
    }

    .player-seek {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.72);
      font-variant-numeric: tabular-nums;
    }

    .player-seek input {
      flex: 1;
      accent-color: #ffffff;
      height: 4px;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 12px;
      width: calc(100% - 24px);
      max-width: 516px;
      background: rgba(34, 34, 38, 0.78);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 5px;
      z-index: 25;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 7px 4px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .loading-box {
      display: flex;
      justify-content: center;
      padding: 36px 0;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 70;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      background: rgba(24, 24, 29, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .setting-row label {
      font-size: 12px;
      color: var(--muted);
    }

    .setting-row select {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="ambient-bg" class="ambient-bg"></div>
  <div id="app"></div>
  <script src="app.js"></script>
  <script>
    window.addEventListener('error', function(e) {
      var appEl = document.getElementById('app');
      if (appEl && !appEl.innerHTML.trim()) {
        appEl.innerHTML = '<div style="padding:24px;color:#fff;font-family:sans-serif;max-width:480px;margin:40px auto;background:rgba(24,24,30,0.9);border:1px solid rgba(255,255,255,0.2);border-radius:18px;">' +
          '<h3 style="margin:0 0 8px;">GlassWave লোড হতে সমস্যা হচ্ছে</h3>' +
          '<p style="margin:0 0 12px;color:#cbd5e1;font-size:14px;">' + (e && e.message ? e.message : 'Script failed to run') + '</p>' +
          '<button onclick="caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}).then(function(){location.reload(true)})" style="padding:10px 16px;border-radius:10px;border:none;background:#a855f7;color:#fff;font-weight:600;cursor:pointer;">ক্যাশে ক্লিয়ার করে রিলোড করুন</button>' +
          '</div>';
      }
    });
  </script>
</body>
</html>
